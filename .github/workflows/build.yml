name: Build for Appetize
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Generate Project
        run: python3 build-system/Make/Make.py --disableProvisioningProfiles generateProject
      - name: Build Simulator App
        run: xcodebuild -workspace Telegram.xcworkspace -scheme Telegram -sdk iphonesimulator -configuration Debug -arch arm64
      - name: Zip App
        run: |
          cd build/Build/Products/Debug-iphonesimulator/
          zip -r Telegram.app.zip Telegram.app
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-for-appetize
          path: build/Build/Products/Debug-iphonesimulator/Telegram.app.zip
